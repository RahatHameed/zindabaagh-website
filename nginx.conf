server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirects stay relative ("/guides"), so they work behind the proxy on any domain.
    absolute_redirect off;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/xml text/xml image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cms.zindabaagh.com; connect-src 'self' https://cms.zindabaagh.com https://challenges.cloudflare.com https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # One address per page, so search engines do not see copies:
    # www.<domain> goes to <domain>, and the three rules below remove /index.html, ".html" and a trailing "/".
    if ($host ~* ^www\.(?<bare>.+)$) {
        return 301 https://$bare$request_uri;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # The home page is served here directly: nginx's normal lookup of "/" passes through /index.html
    # internally and would be caught by the redirect on the next line (endless loop).
    location = / { try_files /index.html =404; }
    location = /index.html { return 301 /; }
    # The two legal pages keep their ".html" address.
    location = /impressum.html { }
    location = /datenschutz.html { }
    location ~ ^(?<clean>/.+)\.html$ { return 301 $clean$is_args$args; }
    location ~ ^(?<noslash>/.+)/$ { return 301 $noslash$is_args$args; }

    location ~* \.(css|js|svg|png)$ {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri.html $uri $uri/ =404;
    }
}
